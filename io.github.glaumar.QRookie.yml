app-id: io.github.glaumar.QRookie
runtime: org.kde.Platform
runtime-version: "6.9"
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: QRookie
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=all
  - --share=network
  - --persist=.android
  - --env=PATH=/app/jre/bin:/app/bin:/usr/bin
cleanup:
  - "*.a"
  - /include
modules:
  - name: 7zip
    buildsystem: simple
    subdir: CPP/7zip/Bundles/Alone
    build-commands:
      - make -j $FLATPAK_BUILDER_N_JOBS -f makefile.gcc
      - install -D ./_o/7za -t /app/bin
    sources:
      - type: archive
        url: https://github.com/ip7z/7zip/archive/refs/tags/25.01.tar.gz
        sha256: 8772e4ef86540c98bf4c23a6d9e13b3a25794d4bb30986ef0b1b9f20075b34c9

  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/install.sh

  - name: android-tools
    buildsystem: simple
    build-commands:
      - install -pDm 0755 adb -t "/app/bin/"
    sources:
      - type: archive
        url: https://dl.google.com/android/repository/platform-tools_r34.0.0-linux.zip
        sha256: 8137c2834dea05cb64c1a8bc041ea00fcd43e3a8a29429ad4f25b8ee51efebf6

  - name: android-apktool
    buildsystem: simple
    build-commands:
      - install -Dm0644 apktool_2.12.0.jar "/app/share/android-apktool/apktool.jar"
      - tar xf apktool-install-linux-r04-brut1.tar.bz2
      - sed -i 's/libdir=.*progdir/libdir="\/app\/share\/'android-apktool'/' apktool
      - install -pDm 0755 apktool -t "/app/bin/"
    sources:
      - type: file
        url: https://github.com/iBotPeaches/Apktool/releases/download/v2.12.0/apktool_2.12.0.jar
        sha256: effb69dab2f93806cafc0d232f6be32c2551b8d51c67650f575e46c016908fdd
      - type: file
        url: http://connortumbleson.com/apktool/googlecode/apktool-install-linux-r04-brut1.tar.bz2
        sha256: cffa5c0a46bab9c66da02cc5db651c3a8321bee98580815e44c802d62a696dfa

  - name: android-sdk-build-tools
    buildsystem: simple
    build-options:
      env:
        target: "/opt/android-sdk/build-tools/android-14"
    build-commands:
      # https://aur.archlinux.org/cgit/aur.git/tree/PKGBUILD?h=android-sdk-build-tools
      - mkdir -p "/app/$target"
      - cp -r * "/app/$target"
      - chmod +Xr -R "/app/$target"

      # Add symlinks to binaries to app/bin/
      - mkdir -p "/app/bin/"
      - find . -maxdepth 1 -type f -executable -printf "%f\n" | xargs -n 1 -I _ ln -s "/app/$target/_" "/app/bin/_"
    sources:
      - type: archive
        url: https://dl.google.com/android/repository/build-tools_r34-linux.zip
        sha256: e858c4b60069d0431051b225d384413b1643e1289b00a4825aed347f25bd510f

  - name: qcoro
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/qcoro/qcoro/archive/refs/tags/v0.12.0.tar.gz
        sha256: 809afafab61593f994c005ca6e242300e1e3e7f4db8b5d41f8c642aab9450fbc

  - name: qrookie
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/glaumar/QRookie.git
        tag: v0.4.2
